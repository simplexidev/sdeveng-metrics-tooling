name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SdevEngProducerRoot: ${{ github.workspace }}/.producer/sdeveng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: simplexidev/sdeveng
          ref: 6f4b618bce27c76c994211910fe2767190508acb
          path: .producer/sdeveng
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SdevEng.Metrics.slnx
      - run: dotnet build SdevEng.Metrics.slnx --no-restore
      - run: dotnet test SdevEng.Metrics.slnx --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project src/SdevEng.Metrics --no-build -- validate-evaluation tests/SdevEng.Metrics.Tests/Fixtures/evaluation-valid-v1.json
      - run: dotnet run --project src/SdevEng.Metrics --no-build -- validate-calibration scenarios/judge-calibration-v1.json
      - name: Validate affected capability selection
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git fetch --no-tags --depth=1 origin "$base"
          git diff --name-only "$base" HEAD | jq -R -s -c 'split("\n") | map(select(length > 0)) | {schemaVersion:"1.0", paths:.}' > changed-paths.json
          dotnet run --project src/SdevEng.Metrics --no-build -- select-affected scenarios/agent-capability-evaluation-v1.json changed-paths.json
      - run: dotnet format SdevEng.Metrics.slnx --no-restore --verify-no-changes
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: TestResults
          retention-days: 7
